[project]
name = "contoso-databricks-platform"
version = "0.1.0"
description = "Contoso data product consumer for databricks-emulator / real Databricks"
requires-python = ">=3.12"
dependencies = [
    "databricks-target",
    "contoso-data-product",
    "requests>=2.32,<3",
    "pyarrow>=18,<24",
]

[dependency-groups]
engine = [
    "databricks-sdk==0.129.0",
    "databricks-connect==19.1",
]
# dbt-databricks 1.12.4 pins databricks-sdk<0.118. Do not include-group engine.
dbt = [
    "dbt-databricks==1.12.4",
]
dev = ["pytest>=9.0.3,<10", "ruff>=0.14,<0.15"]

[tool.uv]
package = false
conflicts = [
    [
        { group = "engine" },
        { group = "dbt" },
    ],
]

[tool.uv.sources]
databricks-target = { path = "../databricks-emulator/python/databricks-target" }
contoso-data-product = { path = "../contoso-data-product" }

[tool.ruff]
line-length = 88
target-version = "py312"
