[project]
name = "contoso-databricks-platform"
version = "0.1.0"
description = "Contoso data product consumer for databricks-emulator / real Databricks"
requires-python = ">=3.12"
dependencies = [
    "databricks-target",
    "contoso-data-product",
    "requests>=2.32,<3",
    "pyarrow>=18,<24",
]

[dependency-groups]
engine = [
    "databricks-sdk==0.129.0",
    "databricks-connect==19.1",
]
# dbt-databricks 1.12.4 pins databricks-sdk<0.118. Do not include-group engine.
dbt = [
    "dbt-databricks==1.12.4",
]
dev = ["pytest>=9.0.3,<10", "ruff>=0.14,<0.15"]

[tool.uv]
package = false
conflicts = [
    [
        { group = "engine" },
        { group = "dbt" },
    ],
]

[tool.uv.sources]
# THE PUBLISHED WHEEL, not the emulator's source tree. This repository is a
# consumer: it must build from what a release ships, or it proves nothing about
# what anyone else can do with one. The tag here is kept equal to
# DATABRICKS_EMULATOR_VERSION in versions.env by `scripts/set_release.py`, and
# `test_the_target_wheel_matches_the_pinned_release` fails if they ever drift.
databricks-target = { url = "https://github.com/calvinchengx/databricks-emulator/releases/download/v0.2.4/databricks_target-0.1.0-py3-none-any.whl" }
# The published wheel, for the same reason as the line above: a consumer that
# reads a sibling's source tree is not consuming anything anyone else can get.
# With both dependencies coming from releases, this repository finally clones
# and builds on its own.
contoso-data-product = { url = "https://github.com/calvinchengx/contoso-data-product/releases/download/v0.1.0/contoso_data_product-0.1.0-py3-none-any.whl" }

[tool.ruff]
line-length = 88
target-version = "py312"
