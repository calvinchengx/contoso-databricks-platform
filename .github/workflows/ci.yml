# The repository's own gate: does it hold together, on all three platforms?
#
# NO SIBLING CHECKOUTS, and that is the assertion. Both `databricks-target` and
# `contoso-data-product` install from the wheels their releases publish, so this
# job clones one repository and nothing else. If either dependency reached for a
# source tree again, `uv sync` here would fail with `Distribution not found` —
# which is what makes "a consumer builds against a published release" a checked
# claim rather than a sentence in the README.
#
# It used to check out two more, and the layout comment explaining why is worth
# remembering rather than deleting: a path dep is invisible until someone tries
# to clone the repository on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Repo tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: databricks-platform-jobs
    steps:
      - uses: actions/checkout@v7
        with:
          path: databricks-platform-jobs
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: matrix.os == 'windows-latest'
        run: choco install make --no-progress -y
        working-directory: ${{ github.workspace }}
      - run: uv sync --frozen --group dev
      - run: make help
      - run: make lint
      - run: make test
      # ruff was configured in pyproject.toml and never run, so the config
      # described an intention rather than a guarantee.
      - name: ruff
        run: uvx ruff@0.15.22 check .
